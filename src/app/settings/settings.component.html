<div class="menu-container">
  <div class="menu-card">
    <h1 class="menu-title">HANGMAN</h1>
    <h2 class="menu-subtitle">Select Language / Válassz nyelvet</h2>

    <div class="lang-options">
      <button class="lang-btn" (click)="selectLanguage('en')">
        <img class="flag-img" src="https://flagcdn.com/gb.svg" alt="Great Britain flag" />
        <span class="lang-name">English</span>
      </button>
      <button class="lang-btn" (click)="selectLanguage('hu')">
        <img class="flag-img" src="https://flagcdn.com/hu.svg" alt="Hungary flag" />
        <span class="lang-name">Magyar</span>
      </button>
    </div>
  </div>
</div>
